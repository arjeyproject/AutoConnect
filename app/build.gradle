plugins { id 'com.android.application' }

dependencies {
    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    implementation 'androidx.work:work-runtime:2.10.0'
    implementation 'com.google.android.material:material:1.12.0'
    testImplementation 'junit:junit:4.13.2'
}

android {
    namespace 'dev.arjey.autoconnect'
    compileSdk 35
    defaultConfig {
        applicationId 'dev.arjey.autoconnect'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
        resourceConfigurations += ['en', 'fa']
    }
    buildTypes {
        debug { versionNameSuffix '-debug' }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    lint { abortOnError false; checkReleaseBuilds true }
    packaging { jniLibs { useLegacyPackaging true } }
    buildFeatures { viewBinding true; buildConfig true }
    sourceSets { main { assets.srcDirs += ['../third-party'] } }
    splits { abi { enable true; reset(); include 'armeabi-v7a', 'arm64-v8a', 'x86_64'; universalApk true } }
}
