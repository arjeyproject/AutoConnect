name: Android
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.10.2' }

      - name: Install Android SDK and NDK
        run: |
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -name sdkmanager -type f | head -n1)"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018'

      - name: Set NDK environment
        run: echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Fetch verified native assets
        run: bash scripts/fetch-android-assets.sh

      - name: Test and lint
        working-directory: android
        run: gradle --no-daemon --stacktrace testDebugUnitTest lintDebug

      - name: Debug build
        if: github.event_name == 'pull_request'
        working-directory: android
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Decode release keystore
        id: keystore
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            mkdir -p android/.android-signing
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/.android-signing/autoconnect.jks
            echo 'available=true' >> "$GITHUB_OUTPUT"
            echo 'Release keystore decoded.'
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo 'No keystore secret set, the release build will fall back to the debug key.'
          fi

      - name: Signed release build
        if: ${{ github.event_name != 'pull_request' && steps.keystore.outputs.available == 'true' }}
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: .android-signing/autoconnect.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon --stacktrace assembleRelease bundleRelease

      - name: Unsigned release build
        if: ${{ github.event_name != 'pull_request' && steps.keystore.outputs.available != 'true' }}
        working-directory: android
        run: gradle --no-daemon --stacktrace assembleRelease bundleRelease

      - name: Checksums
        if: github.event_name != 'pull_request'
        working-directory: android/app/build/outputs/apk/release
        run: sha256sum *.apk | tee SHA256SUMS.txt

      - name: Collect Gradle reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: autoconnect-reports
          path: |
            android/app/build/reports/**
            android/app/build/outputs/logs/**
            android/app/build/test-results/**
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: autoconnect-build
          path: |
            android/app/build/outputs/apk/**/*.apk
            android/app/build/outputs/bundle/**/*.aab
            android/app/build/outputs/apk/release/SHA256SUMS.txt
          if-no-files-found: ignore
