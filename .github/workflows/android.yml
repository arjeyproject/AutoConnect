name: Android
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK and NDK
        run: |
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -name sdkmanager -type f | head -n1)"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018'
      - name: Fetch verified native assets
        run: ./scripts/fetch-native-assets.sh
      - name: Test and lint
        run: gradle --no-daemon testDebugUnitTest lintDebug
      - name: Debug build
        if: github.event_name == 'pull_request'
        run: gradle --no-daemon assembleDebug
      - name: Signed release
        if: ${{ github.event_name != 'pull_request' && secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: ./scripts/package-release.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: autoconnect-build
          path: |
            release/
            app/build/outputs/apk/**/*.apk
          if-no-files-found: ignore
