name: Build AutoConnect for Android

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Android release build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3

      - name: Install the pinned Android NDK
        run: sdkmanager --install "ndk;27.2.12479018" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Fetch and verify the native payload
        run: bash scripts/fetch-android-assets.sh

      - name: Unit tests
        working-directory: android
        run: gradle --no-daemon testDebugUnitTest

      - name: Prepare the release keystore
        id: keystore
        if: github.event_name != 'pull_request'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            mkdir -p android/.android-signing
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/.android-signing/autoconnect.jks
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "No ANDROID_KEYSTORE_BASE64 secret found: the release APKs will be signed with the debug key."
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the release APKs and app bundle
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.keystore.outputs.available == 'true' && '.android-signing/autoconnect.jks' || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease bundleRelease

      - name: Stage the release files
        id: stage
        run: |
          set -euo pipefail
          version="$(grep -oP "versionName '\K[^']+" android/app/build.gradle)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          mkdir -p release
          apk=android/app/build/outputs/apk/release
          cp "$apk/app-universal-release.apk"   "release/AutoConnect-v${version}-Android-Universal.apk"
          cp "$apk/app-armeabi-v7a-release.apk" "release/AutoConnect-v${version}-Android-ARMv7.apk"
          cp "$apk/app-arm64-v8a-release.apk"   "release/AutoConnect-v${version}-Android-ARM64.apk"
          cp "$apk/app-x86_64-release.apk"      "release/AutoConnect-v${version}-Android-x86_64.apk"
          cp android/app/build/outputs/bundle/release/app-release.aab "release/AutoConnect-v${version}-Android-AAB.aab"
          cd release
          sha256sum ./*.apk ./*.aab | sed 's|\./||' > SHA256SUMS.txt
          ls -lh

      - name: Upload the build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AutoConnect-v${{ steps.stage.outputs.version }}-Android
          path: release/*
          if-no-files-found: error

      - name: Publish the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/*
          body: |
            # AutoConnect v${{ steps.stage.outputs.version }}

            Free, ad-free, account-free tunnelling for Android.

            - Brand new AutoConnect interface with a light and a dark appearance
            - Full English and Persian support, including right-to-left layouts
            - Device VPN, Smart mode and local SOCKS5 mode
            - Split tunnelling with include and exclude routing
            - Verified in-app updates with SHA-256 checks

            Install `AutoConnect-v${{ steps.stage.outputs.version }}-Android-Universal.apk` if you are unsure
            which build to pick. Support and news: @ArJeyDev / @ArJeyProject on Telegram.

            The bundled network engines are downloaded from their official releases and verified by
            SHA-256 during the build.
